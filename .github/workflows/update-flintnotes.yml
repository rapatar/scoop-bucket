name: Update FlintNotes manifest

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Scoop
        shell: pwsh
        run: iwr -useb https://get.scoop.sh | iex
      - name: Update manifest
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $checkver = "$env:USERPROFILE\scoop\apps\scoop\current\bin\checkver.ps1"
          & $checkver -App flintnotes -Dir "$PWD\bucket" -Update
      - name: Commit changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/flintnotes.json
          if (git diff --cached --quiet) {
            Write-Host "No changes"
          } else {
            git commit -m "chore: update flintnotes manifest"
            git push
          }
